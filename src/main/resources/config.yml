# SSH server
ssh:
  enabled: false
  port: 2222
  # Authentication mode: "password", "key", or "both"
  auth_mode: password
  # Password for SSH access (used when auth_mode is "password" or "both")
  password: ""
  max_failed_attempts: 3

# Inactivity Auto-Kick (Requires Essentials)
autokick:
  enabled: true

  # Percentage of server player capacity used at which players will be automatically kicked for being inactive. Range: 0.0 - 1.0
