# SQL Configuration Properties
# ============================================
# Supported database types:
#   - sqlite    (embedded, no server needed)
#   - mysql     (MySQL server)
#   - mariadb   (MariaDB server)
#   - postgresql (PostgreSQL server)
#   - h2        (embedded or server mode)
#   - mongodb   (MongoDB - NoSQL document store)
#   - redis     (Redis - NoSQL key-value store)
# ============================================
database.type=sqlite

# ============================================
# Connection Settings
# (used for all remote databases: mysql, mariadb, postgresql, mongodb, redis)
# ============================================
database.host=localhost
database.port=3306

# Database name or file path
# Examples:
#   SQLite:     totalfreedom.db (or full path: /path/to/totalfreedom.db)
#   H2:         ./totalfreedom (file) or mem:totalfreedom (in-memory)
#   MySQL:      totalfreedom
#   MariaDB:    totalfreedom
#   PostgreSQL: totalfreedom
#   MongoDB:    totalfreedom
#   Redis:      0 (database index)
database.name=totalfreedom.db

# ============================================
# Authentication (for databases that require it)
# ============================================
database.username=
database.password=

# ============================================
# Default Ports Reference:
#   MySQL:      3306
#   MariaDB:    3306
#   PostgreSQL: 5432
#   MongoDB:    27017
#   Redis:      6379
#   H2 Server:  9092
# ============================================

# ============================================
# Additional Options
# Prefix with database.option. - these are appended as URL parameters
# or applied as connection properties depending on database type.
#
# Common MySQL/MariaDB options:
#   database.option.useSSL=false
#   database.option.autoReconnect=true
#   database.option.useUnicode=true
#   database.option.characterEncoding=UTF-8
#
# PostgreSQL options:
#   database.option.ssl=false
#   database.option.sslmode=disable
#
# H2 options:
#   database.option.MODE=MySQL
#   database.option.AUTO_SERVER=TRUE
#
# MongoDB options:
#   database.option.authSource=admin
#   database.option.retryWrites=true
#
# Redis options:
#   database.option.timeout=2000
#   database.option.ssl=false
# ============================================