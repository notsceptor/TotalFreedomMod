plugins {
    id 'java'
    id 'com.gorylenko.gradle-git-properties' version '2.5.7'
    id 'org.openrewrite.rewrite' version '7.38.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.property('javaVersion') as int)
    }
}

rewrite {
    activeRecipe(
        "org.openrewrite.java.RemoveUnusedImports",
        "org.openrewrite.java.OrderImports"
    )
    activeStyle("me.totalfreedom.totalfreedommod.WildcardStyle")
}

repositories {
    mavenCentral()
    maven {
        url 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        url 'https://jitpack.io'
    }
    maven {
        url 'https://maven.enginehub.org/repo/'
    }
    maven {
        url 'https://repo.codemc.io/repository/creatorfromhell/'
    }
    maven {
        url 'https://repo.codemc.io/repository/maven-releases/'
    }
    maven {
        name = "playpro"
        url = "https://maven.playpro.com/"
    }
}

dependencies {
    // deprecated
    compileOnly 'commons-io:commons-io:2.16.1'
    compileOnly 'net.milkbowl.vault:VaultUnlockedAPI:2.16'
    
    // paper
    compileOnly 'io.papermc.paper:paper-api:26.2.build.111-stable'
    compileOnly 'net.kyori:adventure-text-serializer-ansi:5.2.0'

    // plugins
    compileOnly('com.sk89q.worldedit:worldedit-bukkit:7.4.5') { transitive = false }
    compileOnly('com.sk89q.worldedit:worldedit-core:7.4.5') { transitive = false }
    compileOnly "net.coreprotect:coreprotect:24.0"

    // packets
    compileOnly 'com.github.retrooper:packetevents-spigot:2.13.0'

    // discord stuff
    compileOnly 'com.discord4j:discord4j-core:3.3.2'

    // ssh
    compileOnly 'org.apache.sshd:sshd-core:2.17.1'

    // sql
    compileOnly 'io.projectreactor:reactor-core:3.8.3'
    compileOnly 'org.postgresql:postgresql:42.7.7'
    compileOnly 'org.xerial:sqlite-jdbc:3.49.1.0'
    compileOnly 'com.mysql:mysql-connector-j:9.3.0'
    compileOnly 'com.zaxxer:HikariCP:6.3.0'

    // logging
    compileOnly 'org.jline:jline:3.28.0'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.24.3'
}

// ... is this really necessary???
configurations.all {
    resolutionStrategy {
        force 'io.papermc.paper:paper-api:26.2.build.111-stable'
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = project.property('javaVersion') as int
    options.compilerArgs.add('-parameters')
    options.compilerArgs.add('-Xlint:unchecked')
    options.deprecation = true
}

gitProperties {
    dateFormat = 'yyyy-MM-dd HH:mm:ss'
    failOnNoGitDirectory = true
    gitPropertiesResourceDir = file("${projectDir}/src/main/resources")
    keys = [
        'git.commit.id',
        'git.commit.id.abbrev'
    ]
    gitPropertiesName = 'git.properties'
}

task addBuildTimeToGitProperties {
    dependsOn generateGitProperties
    doLast {
        def gitPropsFile = file("${projectDir}/src/main/resources/git.properties")
        if (gitPropsFile.exists()) {
            def props = new Properties()
            props.load(new FileInputStream(gitPropsFile))
            
            def dateFormat = new java.text.SimpleDateFormat('yyyy-MM-dd HH:mm:ss')
            props.setProperty('git.build.time', dateFormat.format(new Date()))
            
            def writer = new FileWriter(gitPropsFile)
            props.store(writer, null)
            writer.close()
        }
    }
}

processResources {
    dependsOn addBuildTimeToGitProperties
    filteringCharset = 'UTF-8'
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    filesMatching('build.properties') {
        expand(
            buildAuthor: project.findProperty('buildAuthor') ?: 'TotalFreedom',
            buildCodeName: project.findProperty('buildCodeName') ?: 'Unnamed',
            buildVersion: project.version
        )
    }
    
    filesMatching('plugin.yml') {
        expand(
            tfm: [
                build: [
                    version: project.version
                ]
            ]
        )
    }

    filesMatching('paper-plugin.yml') {
        expand(
            tfm: [
                build: [
                    version: project.version
                ]
            ]
        )
    }
}

jar {
    archiveBaseName = project.name
    archiveVersion = project.version
    destinationDirectory = file('build/libs')
}

